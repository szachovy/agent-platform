---
name: CI Tests

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest
    env:
      AGENT_PLATFORM_ALLOW_INTERNET: "false"
      AGENT_PLATFORM_ALLOW_SSH_AGENT: "false"
      AGENT_PLATFORM_ALLOW_HOST_NETWORK: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start devcontainer
        run: |
          devcontainer up \
            --workspace-folder /tmp \
            --config "${{ github.workspace }}/.devcontainer/devcontainer.json" \
            --build-no-cache

      - name: Run container smoke tests
        run: |
          CONTAINER_ID=$(docker ps -q --filter "label=devcontainer.local_folder=/tmp")
          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: No running devcontainer found"
            exit 1
          fi

          echo "=== Debug: trufflehog filesystem scan ==="
          docker exec "$CONTAINER_ID" \
            /home/linuxbrew/.linuxbrew/bin/trufflehog filesystem /home/node \
              --exclude-paths /home/node/.trufflehog-exclude \
              --fail 2>&1 || true

          echo "=== Debug: trufflehog environment scan ==="
          docker exec "$CONTAINER_ID" \
            bash -c 'printenv | /home/linuxbrew/.linuxbrew/bin/trufflehog stdin --fail 2>&1' || true

          echo "=== Running postStartCommand ==="
          docker exec \
            -e AGENT_PLATFORM_ALLOW_INTERNET="$AGENT_PLATFORM_ALLOW_INTERNET" \
            -e AGENT_PLATFORM_ALLOW_SSH_AGENT="$AGENT_PLATFORM_ALLOW_SSH_AGENT" \
            -e AGENT_PLATFORM_ALLOW_HOST_NETWORK="$AGENT_PLATFORM_ALLOW_HOST_NETWORK" \
            "$CONTAINER_ID" \
            bash -c 'echo "${SSH_AUTH_SOCK:-}" > /tmp/.vscode-ssh-auth-sock && sudo /usr/local/bin/init-firewall.sh && /usr/local/bin/access.sh'
