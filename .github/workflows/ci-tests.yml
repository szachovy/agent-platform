---
name: CI Tests

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-devcontainer:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      AGENT_PLATFORM_ALLOW_INTERNET: "false"
      AGENT_PLATFORM_ALLOW_SSH_AGENT: "false"
      AGENT_PLATFORM_ALLOW_HOST_NETWORK: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        run: |
          docker buildx build \
            --load \
            -t agent-platform-test \
            .devcontainer

      - name: Start container and run smoke tests
        run: |
          docker run \
            --rm \
            --cap-add=NET_ADMIN \
            -e AGENT_PLATFORM_ALLOW_INTERNET="$AGENT_PLATFORM_ALLOW_INTERNET" \
            -e AGENT_PLATFORM_ALLOW_SSH_AGENT="$AGENT_PLATFORM_ALLOW_SSH_AGENT" \
            -e AGENT_PLATFORM_ALLOW_HOST_NETWORK="$AGENT_PLATFORM_ALLOW_HOST_NETWORK" \
            agent-platform-test \
            bash -c 'echo "${SSH_AUTH_SOCK:-}" > /tmp/.vscode-ssh-auth-sock && sudo /usr/local/bin/init-firewall.sh && /usr/local/bin/access.sh'
