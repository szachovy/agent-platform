---
name: CI Tests

on:
  workflow_run:
    workflows: ["Build and Push Agent Platform Devcontainer"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  test-devcontainer:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch-suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            arch-suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      AGENT_PLATFORM_ALLOW_INTERNET: "false"
      AGENT_PLATFORM_ALLOW_SSH_AGENT: "false"
      AGENT_PLATFORM_ALLOW_HOST_NETWORK: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull devcontainer image
        run: |
          set -euo pipefail
          IMAGE_PATH="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          BRANCH_TAG="${BRANCH//\//-}"
          docker pull "${IMAGE_PATH}:${BRANCH_TAG}-${{ matrix.arch-suffix }}"
          docker tag "${IMAGE_PATH}:${BRANCH_TAG}-${{ matrix.arch-suffix }}" agent-platform-test

      - name: Run smoke tests
        run: |
          docker run \
            --rm \
            --cap-add=NET_ADMIN \
            -e AGENT_PLATFORM_ALLOW_INTERNET="$AGENT_PLATFORM_ALLOW_INTERNET" \
            -e AGENT_PLATFORM_ALLOW_SSH_AGENT="$AGENT_PLATFORM_ALLOW_SSH_AGENT" \
            -e AGENT_PLATFORM_ALLOW_HOST_NETWORK="$AGENT_PLATFORM_ALLOW_HOST_NETWORK" \
            agent-platform-test \
            bash -c 'echo "${SSH_AUTH_SOCK:-}" > /tmp/.vscode-ssh-auth-sock && sudo /usr/local/bin/init-firewall.sh && /usr/local/bin/access.sh'

      - name: Probe agent capabilities
        if: ${{ matrix.arch-suffix == 'linux-amd64' }}
        run: |
          for agent in claude codex opencode; do
            docker run \
              --rm \
              -v "${{ github.workspace }}/.devcontainer/capability-check.sh:/usr/local/bin/capability-check.sh:ro" \
              agent-platform-test \
              bash /usr/local/bin/capability-check.sh "$agent"
          done
