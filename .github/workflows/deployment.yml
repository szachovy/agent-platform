---
name: Build and Push Agent Platform Devcontainer

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch-suffix: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch-suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_PATH="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_ref_branched=${IMAGE_PATH}:${BRANCH//\//-}-${{ matrix.arch-suffix }}" >> "$GITHUB_OUTPUT"
          echo "image_path=${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build devcontainer image
        run: |
          docker buildx build \
            --load \
            -t "${{ steps.refs.outputs.image_ref_branched }}" \
            .devcontainer

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'image'
          image-ref: '${{ steps.refs.outputs.image_ref_branched }}'
          scanners: 'vuln'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Push arch-specific image
        run: docker push "${{ steps.refs.outputs.image_ref_branched }}"

  manifest:
    runs-on: ubuntu-latest
    needs: build
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          set -euo pipefail
          IMAGE_PATH="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          BRANCH_TAG="${BRANCH//\//-}"

          docker manifest create "${IMAGE_PATH}:${BRANCH_TAG}" \
            "${IMAGE_PATH}:${BRANCH_TAG}-linux-amd64" \
            "${IMAGE_PATH}:${BRANCH_TAG}-linux-arm64"
          docker manifest push "${IMAGE_PATH}:${BRANCH_TAG}"

          if [[ "${BRANCH}" == "master" || "${BRANCH}" == "main" ]]; then
            docker manifest create "${IMAGE_PATH}:latest" \
              "${IMAGE_PATH}:${BRANCH_TAG}-linux-amd64" \
              "${IMAGE_PATH}:${BRANCH_TAG}-linux-arm64"
            docker manifest push "${IMAGE_PATH}:latest"
          fi
